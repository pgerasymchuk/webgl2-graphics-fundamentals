<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>2D Shapes</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" type="module" defer></script>
</head>

<body>
  <canvas id="canvas" width="500" height="500"></canvas>
  <button id="draw-points-btn">Draw points</button>
  <button id="draw-triangle-btn">Draw a triangle</button>
  <button id="draw-circle-btn">Draw a circle</button>
  <button id="clear-canvas-btn">Clear canvas</button>
  <button id="choose-color-btn">Choose color</button>

  <div id="modal">
    <div id="modal-content">
      <h2>Choose a Color</h2>
      <input type="color" id="color-picker" >
      <button id="save-color-btn">Save color</button>
    </div>
  </div>

</body>
</html>
